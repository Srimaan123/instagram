<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>settings {{ username }}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap&family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="../static/responsive.css">
    <style>
        .profile{
            display: grid;
            grid-template-columns: 2fr 2fr 2fr 2fr;
            grid-template-rows: 2fr 2fr;
            grid-template-areas: 
            "pic text1 text2 text3"
            "desc desc desc desc";
        }
        .profilepic{
            grid-area: pic;
        }
        .text1{
            grid-area: text1;
        }
        .text2{
            grid-area: text2;
        }
        .text3{
            grid-area: text3;
        }
        .desc{
            grid-area: desc;
        }
    </style>
</head>
<body>
    <p id="username" style="display: none;">{{ username }}</p>
    <div class="main w-full h-dvh bg-[var(--bg-color)]">
        <div class="header flex  p-4 border-b border-gray-200">
            <i class="fab fa-instagram text-[length:var(--l)]"></i>
            <h1 class="grow text-[length:var(--m)] text-center"><i class="fas fa-angle-down text-xl mr-1"> </i>{{ username }}</h1>
        </div>
        <div class="content p-4">
            <div class="profile border-2 border-gray-200 rounded-2xl p-4 flex gap-2">
                <img src="https://images.macrumors.com/t/n4CqVR2eujJL-GkUPhv1oao_PmI=/1600x/article-new/2019/04/guest-user-250x250.jpg"  alt="" class="profilepic w-[length:var(--story)] h-[length:var(--story)] rounded-full ">
                <div class="text1 flex flex-col justify-center items-center">
                    <p class="text-xl">{{ followers }}</p>
                    <p class="text-xl font-bold">followers</p>
                </div>
                <div class="text2 flex flex-col justify-center items-center">
                    <p class="text-xl">{{ following }}</p>
                    <p class="text-xl font-bold">following</p>
                </div>
                <div class="text3 flex flex-col justify-center items-center">
                    <p class="text-xl">{{ posts }}</p>
                    <p class="text-xl font-bold">posts</p>
                </div>
                <div class="desc flex flex-col justify-center">
                    <h1 class="text-xl font-bold">{{ username }} <i class="fas fa-circle-check text-blue-500"></i></h1>
                    <p class="text-lg text-gray-500">something is better than nothing</p>
                </div>
            </div>
            <div class="settings p-2 border-2 border-gray-200 rounded-xl ">
                <div class="setting flex justify-between items-center">
                    <p class="text-xl text-black text-bold">Account Type</p>
                    <select name="AccType" id="AccType" class="border border-gray-200 p-2 rounded-xl">
                        <option value="" class="">{{ accountType[0] }}</option>
                        <option value="" class="">{{ accountType[1] }}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="navigation flex flex-col items-center">
            <div class="icon grow">
                <i class="fab fa-instagram text-5xl"></i>
            </div>
            <div class="icons flex flex-col gap-4 pl-4 pr-4">
                <i class="hide fas fa-heart text-red-400 text-[length:var(--l)]" onclick="window.location.href = `/notifications/${document.querySelector('#username').textContent}`"></i>
                <i class="fas fa-home text-[length:var(--l)]"></i>
                <i class="far fa-plus text-[length:var(--l)]"></i>
                <i class="fas fa-paper-plane text-[length:var(--l)]"></i>
                <i class="fas fa-search text-[length:var(--l)]"
                onclick="window.location.href = `/search/${document.querySelector('#username').textContent}`"></i>
            </div>
            <div class="hide grow flex flex-col justify-end gap-4 pb-4">
                <i class="fas fa-bars text-[length:var(--l)]"></i>
                <img src="https://images.macrumors.com/t/n4CqVR2eujJL-GkUPhv1oao_PmI=/1600x/article-new/2019/04/guest-user-250x250.jpg" class="w-[length:var(--l)] rounded-full" onclick="window.location.href = `/settings/${document.querySelector('#username').textContent}`">
            </div>
        </div>
    </div>
</body>
</html>
