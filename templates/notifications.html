<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap&family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <p id="username" style="display: none;">{{ username }}</p>
    <div class="main w-full min-w-dvh">
        <div class="header p-2 flex">
            <i class="fas fa-angle-left text-2xl text-black" onclick="window.location.href = `/main/${document.querySelector('#username').textContent}`"></i>
            <h1 class="text-xl font-['inter'] grow text-center font-bold">Notifications</h1>
        </div>
        <div class="content p-2">
            <div class="following border-b-2 border-gray-200 p-2">
                {% for follower in all_requests.following %}
                <div class="follower flex gap-4 items-center">
                    <img src="" alt="" class="h-12 w-12 bg-black rounded-full">
                    <p class="text-black"><span class="text-black font-bold">{{ follower }}</span> started following you</p>
                </div>
                {% endfor %}
            </div>
            
        {{all_requests.follow_requests}}
        {{all_requests.accepted_requests}}
        </div>
    </div>
    <script src="../static/notifications.js"></script>
</body>
</html>
