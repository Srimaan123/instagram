<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"
        integrity="sha512-8BHxHDLsOHx+flIrQ0DrZcea7MkHqRU5GbTHmbdzMRnAaoCIkZ97PqZcXJkKZckMMhqfoeaJE+DNUVuyoQsO3Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../static/responsive.css">
</head>

<body>
    <p id="username" style="display: none;">{{ username }}</p>
    <div class="main w-full h-dvh">
        <div class="header p-2 border-b-2 border-gray-200 flex items-center justify-between">
            <i class="fab fa-instagram text-3xl"></i>
            <i class="fas fa-heart text-2xl text-red-400 hover:text-red-300"
                onclick="window.location.href = `/notifications/${document.querySelector('#username').textContent}`"></i>
        </div>
        <div class="content grow flex  items-center  gap-4">
            <div class="w-5/12 h-full p-4 flex flex-col items-center  gap-4">
                <div class="input justify-center flex items-center w-full">
                    <div class="wrap relative flex items-center w-8/12">
                        <i class="fas fa-search text-gray-400 absolute left-3"></i>
                        <input type="text" name="" id="" placeholder="enter username"
                            class="search bg-gray-100 text-black w-full placeholder-gray-500 rounded-full p-4 pl-8 outline-none">
                    </div>
                </div>
                <div class="accounts border border-gray-200 w-full rounded-xl p-2">
                    {% for account in accounts %}
                    <div id="{{ account }}" class="account flex w-full rounded-xl  gap-2">
                        <img src="" alt="" class="h-12 w-12 rounded-full bg-blue-500">
                        <h1 class="name font-bold font-['inter'] mt-2">{{ account }}</h1>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="iframe-holder w-7/12 h-full">
                <iframe src="" frameborder="0" sandbox="allow-scripts" class="iframe w-full h-full"></iframe>
            </div>
        </div>
        <div class="navigation flex flex-col items-center">
            <div class="icon grow">
                <i class="fab fa-instagram text-5xl"></i>
            </div>
            <div class="icons flex flex-col gap-4 pl-4 pr-4">
                <i class="hide fas fa-heart text-red-400 text-2xl"
                    onclick="window.location.href = `/notifications/${document.querySelector('#username').textContent}`"></i>
                <i class="fas fa-home text-2xl"
                    onclick="window.location.href = `/main/${document.querySelector('#username').textContent}`"></i>
                <i class="far fa-plus text-2xl"></i>
                <i class="fas fa-paper-plane text-2xl"
                    onclick="window.location.href = `/accounts/${document.querySelector('#username').textContent}`"></i>
                <i class="fas fa-search text-2xl"
                    onclick="window.location.href = `/search/${document.querySelector('#username').textContent}`"></i>
            </div>
            <div class="hide grow flex flex-col justify-end gap-4 pb-4">
                <i class="fas fa-bars text-2xl"></i>
                <img src="https://images.macrumors.com/t/n4CqVR2eujJL-GkUPhv1oao_PmI=/1600x/article-new/2019/04/guest-user-250x250.jpg"
                    class="w-6 rounded-full"
                    onclick="window.location.href = `/settings/${document.querySelector('#username').textContent}`">
            </div>
        </div>
    </div>
    <script src="../static/accounts.js"></script>
</body>

</html>
