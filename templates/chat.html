<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"
        integrity="sha512-8BHxHDLsOHx+flIrQ0DrZcea7MkHqRU5GbTHmbdzMRnAaoCIkZ97PqZcXJkKZckMMhqfoeaJE+DNUVuyoQsO3Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="../static/dist/output.css">
    <link rel="stylesheet" href="../static/fontawesome-free-7.3.1-web/css/all.min.css">
    <style>
        .content{
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <p id="sender-id" style="display: none;">{{ sender_id }}</p>
    <p id="sender" style="display: none;">{{ sender }}</p>
    <p id="receiver-id" style="display: none;">{{ receiver_id }}</p>
    <p id="receiver" style="display: none;">{{ receiver }}</p>
    <p id="room_id" style="display: none;"></p>
    <div class="main flex flex-col w-full h-dvh">
        <div class="header flex items-center p-2 gap-8 border-b border-gray-200">
            <i class="fas fa-arrow-left text-2xl"
                onclick="document.location.href = `/accounts/${document.querySelector('#sender').textContent}`"></i>
            <div class="grow flex">
                <img src="" alt="" class="h-12 w-12 rounded-full bg-blue-300 mr-2">
                <div class="flex flex-col">
                    <h1 class="text-xl font-bold">{{ receiver }}</h1>
                    <p class="text-gray-500 text-base font-[500]">Active 10m ago</p>
                </div>
            </div>
        </div>
        <div class="content grow gap-2 flex flex-col p-4">
            {% for chat in chats %}
            {% if sender == chat[2] %}
            <div class="wrap flex justify-end">
                <div class="message bg-[var(--chat-bubble)] rounded-tr-xl rounded-tl-full rounded-br-full rounded-bl-full p-2 w-6/12">
                    <p class="id" style="display: none;">{{ chat[0] }}</p>
                    <p class="text-white font-[500]">{{ chat[1] }}</p>
                </div>
            </div>
            {% else %}
            <div class="wrap flex">
                <div class="message bg-gray-200 rounded-tr-full rounded-br-full rounded-bl-full rounded-tl-xl p-2 w-6/12">
                    <p class="id" style="display: none;">{{ chat[0] }}</p>
                    <p class="text-black font-[500]">{{ chat[1] }}</p>
                </div>
            </div>
            {% endif %}
            {% endfor %}
        </div>
        <div class="flex p-4 gap-4">

            <input type="text" name="send" id="input" placeholder="Enter message ..."
                class="rounded-full border border-gray-300 w-full p-3 placeholder-gray-500 font-md">
            <div
                class="sendBtn flex justify-center items-center p-2 rounded-full bg-[var(--chat-bubble)] h-full aspect-[2/1.5]">
                <i class="fas fa-paper-plane bg-[var(--chat-bubble)] text-white text-2xl"></i>
            </div>
        </div>
    </div>
    <script src="../static/chat.js"></script>
</body>

</html>
